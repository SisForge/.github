name: GHCR canary single publication

on:
  push:
    branches: ["test/ghcr-canary-20261107"]

permissions: {}

jobs:
  baseline:
    if: github.repository == 'SisForge/.github' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
    steps:
      - name: Record canary tag baseline without registry writes
        id: snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          tags = {}
          visible = True
          for page in range(1, 11):
              url = ("https://api.github.com/orgs/SisForge/packages/container/"
                     "docker-workflow-canary/versions?per_page=100&page=" + str(page))
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code != 404 or page != 1:
                      raise RuntimeError("Canary baseline API failed with HTTP " + str(error.code)) from None
                  visible = False
                  print("Baseline API returned 404: package absent or not visible to this token.")
                  break
              for version in versions:
                  for tag in version.get("metadata", {}).get("container", {}).get("tags", []):
                      tags[tag] = version["name"]
              if len(versions) < 100:
                  break
          else:
              raise RuntimeError("Canary baseline pagination limit reached")
          snapshot = {"visible": visible, "tags": tags}
          print("Baseline:", json.dumps(snapshot, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("snapshot=" + json.dumps(snapshot, separators=(",", ":")) + "\n")
          PY

  canary:
    needs: baseline
    if: github.repository == 'SisForge/.github' && github.ref == 'refs/heads/test/ghcr-canary-20261107' && github.run_attempt == 1
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image-name: docker-workflow-canary
      context: .github/fixtures/docker
      push: true
      push-latest: false
      extra-tags: ""
      platforms: linux/amd64

  verify:
    needs: [baseline, canary]
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: trivy-image-docker-workflow-canary
          path: scan-results
      - name: Verify remote manifest, SHA-only publication and unchanged tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          SCANNED: ${{ needs.canary.outputs.scanned-digest }}
          PUBLISHED: ${{ needs.canary.outputs.published-digest }}
          BASELINE: ${{ needs.baseline.outputs.snapshot }}
        run: |
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "sisforge/docker-workflow-canary"
          commit = os.environ["COMMIT_SHA"]
          expected = os.environ["SCANNED"]
          assert re.fullmatch(r"[a-f0-9]{40}", commit), "Expected full commit SHA"
          assert re.fullmatch(r"sha256:[a-f0-9]{64}", expected), "Missing scanned digest"
          assert expected == os.environ["PUBLISHED"], "Published output differs from scanned digest"
          with open("scan-results/trivy-image-results.sarif") as source:
              sarif = json.load(source)
          findings = [result for run in sarif["runs"] for result in run.get("results", [])]
          assert not findings, "Trivy SARIF contains blocking results"

          query = urllib.parse.urlencode({
              "service": "ghcr.io", "scope": "repository:" + repository + ":pull",
          })
          credentials = base64.b64encode(
              (os.environ["GH_USER"] + ":" + os.environ["GH_TOKEN"]).encode()
          ).decode()
          request = urllib.request.Request("https://ghcr.io/token?" + query, headers={
              "Authorization": "Basic " + credentials,
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  auth = json.load(response)
          except urllib.error.HTTPError as error:
              raise RuntimeError("GHCR read authentication failed with HTTP " + str(error.code)) from None
          bearer = auth.get("token") or auth.get("access_token")
          assert bearer, "Missing GHCR read token"

          def get_registry(path):
              request = urllib.request.Request("https://ghcr.io/v2/" + repository + "/" + path, headers={
                  "Authorization": "Bearer " + bearer,
                  "Accept": "application/vnd.oci.image.manifest.v1+json",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.read(), response.headers
              except urllib.error.HTTPError as error:
                  raise RuntimeError("GHCR read failed with HTTP " + str(error.code) + " at " + path) from None

          def manifest_digest(reference):
              raw, headers = get_registry("manifests/" + reference)
              digest = "sha256:" + hashlib.sha256(raw).hexdigest()
              manifest = json.loads(raw)
              assert manifest["mediaType"] == "application/vnd.oci.image.manifest.v1+json", "Remote media type changed"
              header = headers.get("Docker-Content-Digest")
              assert not header or header == digest, "Registry digest header mismatch"
              return digest

          assert manifest_digest(commit) == expected, "SHA tag manifest differs from scanned manifest"
          assert manifest_digest(expected) == expected, "Digest reference differs from scanned manifest"

          tags = set()
          next_path = "tags/list?n=100"
          for page in range(10):
              raw, headers = get_registry(next_path)
              tags.update(json.loads(raw).get("tags") or [])
              link = headers.get("Link")
              if not link:
                  break
              match = re.fullmatch(r'<([^>]+)>;\s*rel="next"', link)
              assert match, "Unexpected GHCR pagination link"
              target = urllib.parse.urljoin("https://ghcr.io/v2/" + repository + "/", match.group(1))
              prefix = "https://ghcr.io/v2/" + repository + "/"
              assert target.startswith(prefix), "Unexpected registry pagination destination"
              next_path = target[len(prefix):]
          else:
              raise RuntimeError("Registry tag pagination limit reached")
          baseline = json.loads(os.environ["BASELINE"])
          previous = baseline["tags"]
          assert commit not in previous, "Canary SHA tag unexpectedly existed before publication"
          assert tags == set(previous) | {commit}, "Unexpected tag changes"
          for tag in ("latest", "staging"):
              if tag in previous:
                  assert manifest_digest(tag) == previous[tag], "Mutable tag changed: " + tag
              else:
                  assert tag not in tags, "Forbidden tag created: " + tag
          if not baseline["visible"]:
              assert tags == {commit}, "Cannot verify unknown pre-existing tags"
              limitation = "Baseline API returned 404 (absent or inaccessible); final registry contains only the authorized SHA tag."
          else:
              limitation = "Baseline package tags and mutable-tag digests unchanged."
          summary = (
              "Single canary publication verified.\n\n"
              "- Image: ghcr.io/" + repository + ":" + commit + "\n"
              "- Scanned/published/remote manifest: " + expected + "\n"
              "- Trivy blocking SARIF results: 0\n"
              "- Tags after publication: " + ", ".join(sorted(tags)) + "\n"
              "- " + limitation + "\n"
              "- No latest/staging writes; verification used pull-only registry authentication.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY
