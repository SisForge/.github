name: Cloudflare Workers Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "22"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    name: Build · Deploy Workers (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from each repo's packageManager field (single source of truth)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm run build:cf
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            staging) pnpm exec wrangler deploy --env staging ;;
            production) pnpm exec wrangler deploy ;;
            *) echo "Unknown environment: $DEPLOY_ENVIRONMENT" >&2; exit 1 ;;
          esac
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
