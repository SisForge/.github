name: Docker Build

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (unused — kept for consistency)
        required: false
        type: string
        default: "22"
      image-name:
        description: Image name (e.g. siswrench-api)
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  build-scan-push:
    name: Build · Trivy · Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/sisforge/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container scan — block on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/sisforge/${{ inputs.image-name }}:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ inputs.image-name }}
          path: trivy-image-results.sarif

      - name: Push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sisforge/${{ inputs.image-name }}:${{ github.sha }}
            ghcr.io/sisforge/${{ inputs.image-name }}:latest
          cache-from: type=gha

  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Notify result
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ needs.build-scan-push.result == 'success' && ':docker: *Image pushed*' || ':x: *Docker build/scan failed*' }} — `${{ inputs.image-name }}` @ `${{ github.ref_name }}`",
              "attachments": [{
                "color": "${{ needs.build-scan-push.result == 'success' && 'good' || 'danger' }}",
                "fields": [
                  { "title": "Image", "value": "ghcr.io/sisforge/${{ inputs.image-name }}:${{ github.sha }}", "short": false },
                  { "title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
